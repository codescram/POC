<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .center-block{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(6, 50px);
            gap: 10px;
        }
        .r1, .r2, .r3, .r4{
            border-radius: 5px;
            border: 1px solid #dddddd;
            height: 100px;
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
        }
        .r1{
            grid-column:span 2;
        }
        .r2{
            grid-column:span 3;
        }
        .r3{
            grid-column:span 4;
            height: 50px;
            border: none;
        }
        .r4{
            grid-column:span 2;
            height: 50px;
            border: none;
        }
        .r3 input, .r4 input{
            width: 100%;
            height: 100%;
            border-radius: 5px;
            border:1px solid #dddddd;
            padding: 10px;
            box-sizing: border-box;
            cursor:text
        }
        .r4 input{
            cursor: pointer;
        }
        #red{
            background:#ff0000;
        }
        #blue{
            background:#0000ff;
        }
        #green{
            background:#008000;
        }
        #yellow{
            background:#dfab00;
        }
        #black{
            background:#000000;
        }
    </style>
</head>
<body>
    <div class="center-block">
        <ul class="grid">
            <li class="r1" id="red">Red</li>
            <li class="r1" id="blue">Blue</li>
            <li class="r1" id="green">Green</li>
            <li class="r2" id="yellow">Yellow</li>
            <li class="r2" id="black">Black</li>
            <li class="r3"><input id="custom-color" type="text" placeholder="Enter custom color"></li>
            <li class="r4"><input id="custom-button" type="submit" value="Submit" placeholder="Enter custom color"></li>
        </ul>
    </div>
    <script>
        const body = document.querySelector('body')
        document.querySelectorAll('li').forEach(function(item){
            item.addEventListener('click', function(e){
               body.style.background = e.target.id;
            })
        })

        const submitval = document.getElementById('custom-button').addEventListener('click', function(){
            const inputval = document.getElementById('custom-color').value;
            body.style.background = inputval
        })
    </script>
</body>
</html>
