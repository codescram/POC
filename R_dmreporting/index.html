<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="bg-gray-900 text-base text-white">
        <section class="bg_social flex h-screen w-screen justify-center items-center flex-col">
            <div class="logo">
                <img class="w-32" src="img/new_logo.png" />
            </div>
            <div class="login bg-gray-800 w-1/3 min-w-96 px-9 pt-5 pb-8 text-white shadow-2xl shadow-blue-500">
                <h1 class="text-2xl text-center mb-5 text-bold">Login</h1>
                <Form>
                    <ul class="login-form">
                        <li class="mb-3">
                            <label class="block mb-3" for="user">Username/Email</label>
                            <input id="user" class="border w-full h-9 bg-gray-600 border-gray-700" type="text" />
                        </li>
                        <li>
                            <Label class="block mb-2">Password</Label>
                            <input type="password" class="border w-full h-9 bg-gray-600 border-gray-700" />
                        </li>
                        <li class="text-end mb-5"><a href="forgot.html" class="text-sm text-gray-500 hover:text-gray-200">Forgot Password?</a></li>
                        <li><button type="button" class="w-full block bg-blue-500 px-5 py-2 cursor-pointer" onclick="window.location.href='/dashboard.html'">Submit</button></li>
                    </ul>
                </Form>
            </div>
        </section>
    </body>
</html>
