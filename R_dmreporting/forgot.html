<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://kit.fontawesome.com/817b46ba09.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="css/style.css" />
    </head> 
    <body class="bg-gray-900 text-base text-white">
        <section class="flex justify-center items-center h-screen w-screen flex-col">
            <div class="bg_social bg-gray-800 min-w-96 w-1/3 shadow-2xl shadow-blue-500">
                <div class="mb-5">
                    <a href="index.html" class="block text-sm py-3 bg-gray-700 px-5 hover:bg-gray-600 text-gray-500 hover:text-gray-200"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
                </div>
                <h1 class="text-2xl text-center mb-5">Forgot Password</h1>
                <form class="pb-9 px-9 block">
                    <ul>
                        <li class="mb-5">
                            <label class="block mb-2">Registered Email</label>
                            <input type="text" class="border-gray-700 bg-gray-600 w-full h-9" />
                        </li>
                        <li><button class="w-full mx-auto block bg-blue-500 px-5 py-2">Send Password</button></li>
                    </ul>
                </form>
            </div>
        </section>
    </body>
</html>
